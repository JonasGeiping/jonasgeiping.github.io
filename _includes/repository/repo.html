{% assign repo_url = include.repository | split: '/' %}

<div class="repo p-2 text-center">
  <a href="https://github.com/{{ include.repository }}" class="repo-card" style="display:block; text-decoration:none; color:inherit; border:1px solid var(--global-divider-color); border-radius:8px; padding:16px; text-align:left; transition: all 0.3s ease; background-color: var(--global-bg-color);"
     onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'; this.style.transform='translateY(-3px)';"
     onmouseout="this.style.boxShadow='none'; this.style.transform='none';">
    <div style="display:flex; align-items:center; margin-bottom:8px;">
      <svg style="margin-right:8px; flex-shrink:0;" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg>
      <span class="repo-name" style="font-weight:600; color:var(--global-theme-color);">{{ repo_url[1] }}</span>
    </div>
    {% if repo_url[0] != site.github_username %}
    <div style="font-size:0.8em; color:var(--global-text-color-light); margin-bottom:6px;">{{ repo_url[0] }}</div>
    {% endif %}
    <div class="repo-description" style="font-size:0.85em; color:var(--global-text-color-light); margin-bottom:10px; min-height:2.5em;" data-repo="{{ include.repository }}">
    </div>
    <div class="repo-stats" style="font-size:0.8em; color:var(--global-text-color-light); display:flex; align-items:center; gap:12px;" data-repo-stats="{{ include.repository }}">
    </div>
  </a>
</div>
